seed: 42
runtime:
  device: auto
  data_parallel: true

model:
  name: unet34
  pretrained: true

data:
  # null = Kaggle mount when available, otherwise KaggleHub download/cache.
  data_root: null
  # null = project data/ for official validation/test masks.
  mask_root: null
  val_fraction: 0.2
  num_workers: 2

search:
  allow_batch32: false

training:
  selection_metric: dice
  frozen_epochs: 30
  unfrozen_epochs: 30
  lr_finder:
    lr_min: 1.0e-6
    lr_max: 1.0
    n_iter: 100
    beta: 0.9
  scheduler:
    cut_frac: 0.1
    ratio: 32.0

study:
  # Separate study namespace: Dice scores must not be mixed with old Jaccard trials.
  name: unet34_isic_hpo_best_dice
  storage: experiments/optuna/unet34/optuna.db
  pruner:
    percentile: 25.0
    n_startup_trials: 5
    n_warmup_steps: 0
    interval_steps: 1
    n_min_trials: 5

artifacts:
  top5_dir: checkpoints/optuna/unet34/top5_128_dice
  top5_manifest: experiments/optuna/unet34/top5_manifest_dice.csv
  trials_csv: experiments/optuna/unet34/trials.csv
  confirmation_dir: checkpoints/optuna/unet34/confirmation_256_dice
