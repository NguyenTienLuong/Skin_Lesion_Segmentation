seed: 42
model:
  name: unet34
  pretrained: true

data:
  tuning_split: data/splits/tuning_split.csv
  folds_3: data/splits/folds_3.csv
  heldout_test: data/splits/heldout_test.csv
  num_workers: 2

augmentation:
  degrees: 44.0
  zoom_max: 1.05
  brightness: 0.2
  contrast: 0.2

search:
  allow_batch32: false

training:
  frozen_epochs: 30
  unfrozen_epochs: 30
  lr_finder:
    lr_min: 1.0e-6
    lr_max: 1.0
    n_iter: 100
    beta: 0.9
  scheduler:
    cut_frac: 0.1
    ratio: 32.0

study:
  name: unet34_isic_hpo
  storage: experiments/optuna/unet34/optuna.db
  pruner:
    percentile: 25.0
    n_startup_trials: 5
    n_warmup_steps: 0
    interval_steps: 1
    n_min_trials: 5

artifacts:
  top5_dir: checkpoints/optuna/unet34/top5_128
  top5_manifest: experiments/optuna/unet34/top5_manifest.csv
  trials_csv: experiments/optuna/unet34/trials.csv
  confirmation_dir: checkpoints/optuna/unet34/confirmation_256
