seed: 42
runtime:
  # auto: CPU when CUDA is unavailable, otherwise use CUDA.
  device: auto
  # Use every visible GPU. Global batch_size is kept unchanged.
  data_parallel: true

model:
  name: unet34
  pretrained: true

data:
  # null = Kaggle mount when available, otherwise KaggleHub download/cache.
  data_root: null
  # null = project data/ for official validation/test masks.
  mask_root: null
  n_splits: 3
  num_workers: 2

optimizer:
  name: Adam
  weight_decay: 0.0

loss:
  name: BCE

training:
  sizes: [128, 256]
  batch_size: 8
  frozen_epochs: 30
  unfrozen_epochs: 30
  selection_metric: dice
  lr_finder:
    lr_min: 1.0e-6
    lr_max: 1.0
    n_iter: 100
    beta: 0.9
  scheduler:
    cut_frac: 0.1
    ratio: 32.0

artifacts:
  experiment_dir: experiments/baseline/unet34
  checkpoint_dir: checkpoints/baseline/unet34
  final_checkpoint_root: checkpoints/baseline/unet34
  final_experiment_dir: experiments/baseline/unet34
