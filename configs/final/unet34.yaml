# Điền/ghi đè bằng configuration winner sau bước confirm_top5_256.
# File mặc định này dùng cấu hình baseline để pipeline có thể chạy thử.
seed: 42
runtime:
  device: auto
  data_parallel: true

model:
  name: unet34
  pretrained: true

data:
  # null = Kaggle mount when available, otherwise KaggleHub download/cache.
  data_root: null
  # null = project data/ for official validation/test masks.
  mask_root: null
  n_splits: 3
  num_workers: 2
optimizer:
  name: Adam
  weight_decay: 0.0
loss:
  name: BCE
training:
  selection_metric: dice
  sizes: [128, 256]
  batch_size: 8
  frozen_epochs: 30
  unfrozen_epochs: 30
  lr_finder:
    lr_min: 1.0e-6
    lr_max: 1.0
    n_iter: 100
    beta: 0.9
  scheduler:
    cut_frac: 0.1
    ratio: 32.0
artifacts:
  final_checkpoint_root: checkpoints/final/unet34
  final_experiment_dir: experiments/final/unet34
